name: 更新宏观数据

on:
  schedule:
    # 每天 22:40 UTC（北京时间次日 06:40），美国当天的数据都已进 FRED
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-macro
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 测试
        run: python3 -m unittest discover -s tests
      - name: 下载 FRED 并生成看板数据
        # 单条序列失败不会让这一步失败：沿用旧文件，并记进 data/macro/status.json。
        run: python3 scripts/update_macro.py
      - name: 提交数据
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "data: 更新宏观数据"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
