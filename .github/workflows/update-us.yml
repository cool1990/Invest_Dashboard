name: 更新美股数据

on:
  schedule:
    # 每天 02:40 UTC（北京时间 10:40）：旧站早晨笔记已收录，比半导体那次晚半小时
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-us
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 测试
        run: python3 -m unittest discover -s tests
      - name: 下载并生成看板数据
        # 单个来源失败不会让这一步失败：沿用旧文件，并记进 data/us/status.json。
        run: python3 scripts/update_us.py
      - name: 提交数据
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/us data/us
          for f in SP500 VIXCLS CPATAX NCBEILQ027S; do
            if [ -f "data/raw/fred/$f.csv" ]; then git add "data/raw/fred/$f.csv"; fi
          done
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "data: 更新美股数据"
          # 宏观、半导体工作流也会提交 data/，先拉下来再推（写的文件不重叠）
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
