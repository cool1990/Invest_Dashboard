name: 更新半导体数据

on:
  schedule:
    # 每天 02:10 UTC（北京时间 10:10）：旧站早晨的半导体笔记已收录
    - cron: "10 2 * * *"
    # 每月 5–12 日 08:10 UTC（北京时间 16:10）再跑一次：台湾月营收在次月 10 日前公布，台积电下午 1:30
    - cron: "10 8 5-12 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-semis
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 测试
        run: python3 -m unittest discover -s tests
      - name: 下载并生成看板数据
        # 单个来源失败不会让这一步失败：沿用旧文件，并记进 data/semis/status.json。
        # KOSIS_API_KEY 可选：没有时库存周期改用美国数据。
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python3 scripts/update_semis.py
      - name: 提交数据
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "data: 更新半导体数据"
          # 宏观工作流也会提交 data/，先把它的提交拉下来再推（两边写的文件不重叠）
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
