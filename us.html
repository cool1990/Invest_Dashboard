<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>美股 · 投资看板</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-board="us">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">投资看板</a>
      <nav class="nav" id="nav" aria-label="板块"></nav>
    </div>
  </header>
  <main id="app">
    <div class="page-head">
      <div>
        <h1>美股</h1>
        <div class="sub">盈利 · 估值 · 情绪 <span class="muted small" id="asof"></span></div>
      </div>
    </div>

    <div class="top">
      <div class="top-main">
        <section class="card verdict" id="verdict"></section>
        <section class="card statelog" id="statelog"></section>
        <section class="card states" id="states" aria-label="三个维度"></section>
      </div>
      <aside class="card side" aria-labelledby="up-title">
        <h2>今日发布</h2>
        <div id="today"></div>
        <h2 id="up-title" class="side-h2">即将发布</h2>
        <p class="small muted">未来 14 天，观察名单上的美股财报。星级是重要程度，点「为什么」看理由。</p>
        <div id="upcoming"></div>
      </aside>
    </div>

    <h2 class="layer">依据</h2>
    <p class="layer-sub">每块只列决定上面那句话的几个数：最新值、较上期、对照的锚点。标「参考」的不进判断。点指标名跳到下面的图。盈利跟踪和参与度从 2026 年 9 月才有，图会很短。</p>
    <div class="section-nav">
      <div class="chips" id="chips"></div>
      <div class="seg" id="range" role="group" aria-label="时间范围"></div>
    </div>
    <div id="sections"></div>

    <div class="card notes" id="notes"></div>
    <div class="card health" id="health"></div>
  </main>
  <footer>数据来源：盈利跟踪与情绪笔记（经旧站整理）、圣路易斯联储 FRED、FINRA 融资余额、跟踪标普 500 的 ETF 持仓。仅供个人参考。</footer>
  <script src="assets/vendor/chart.umd.min.js"></script>
  <script src="assets/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/board.js"></script>
  <script src="assets/js/us.js"></script>
</body>
</html>
